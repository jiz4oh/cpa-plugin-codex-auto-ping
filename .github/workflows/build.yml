name: build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Linux amd64 plugin
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildmode=c-shared -o auto-ping_linux_amd64.so .
          rm -f auto-ping_linux_amd64.h
      - uses: actions/upload-artifact@v4
        with:
          name: auto-ping_linux_amd64
          path: auto-ping_linux_amd64.so

  darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build macOS arm64 plugin
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -buildmode=c-shared -o auto-ping_darwin_arm64.dylib .
          rm -f auto-ping_darwin_arm64.h
      - uses: actions/upload-artifact@v4
        with:
          name: auto-ping_darwin_arm64
          path: auto-ping_darwin_arm64.dylib

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-amd64
      - darwin-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
