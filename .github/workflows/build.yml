name: build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_ID: codex-auto-ping

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve version and normalize plugin metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("registry.json"))["plugins"][0]["version"])')
          test -n "$version"
          sed -i 's/pluginName    = "auto-ping"/pluginName    = "codex-auto-ping"/' main.go
          sed -i -E 's/version       = "[^"]+"/version       = "'"$version"'"/' main.go
          sed -i 's/\[auto-ping\]/[codex-auto-ping]/g' main.go
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
      - name: Build and package Linux amd64
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          mkdir -p package dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildmode=c-shared -trimpath -ldflags="-s -w" \
            -o "package/${PLUGIN_ID}.so" .
          rm -f "package/${PLUGIN_ID}.h"
          (cd package && zip -q "../dist/${PLUGIN_ID}_${version}_linux_amd64.zip" "${PLUGIN_ID}.so")
      - uses: actions/upload-artifact@v4
        with:
          name: codex-auto-ping_linux_amd64
          path: dist/*.zip

  darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve version and normalize plugin metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("registry.json"))["plugins"][0]["version"])')
          test -n "$version"
          sed -i '' 's/pluginName    = "auto-ping"/pluginName    = "codex-auto-ping"/' main.go
          sed -i '' -E 's/version       = "[^"]+"/version       = "'"$version"'"/' main.go
          sed -i '' 's/\[auto-ping\]/[codex-auto-ping]/g' main.go
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
      - name: Build and package macOS arm64
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          mkdir -p package dist
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -buildmode=c-shared -trimpath -ldflags="-s -w" \
            -o "package/${PLUGIN_ID}.dylib" .
          rm -f "package/${PLUGIN_ID}.h"
          (cd package && zip -q "../dist/${PLUGIN_ID}_${version}_darwin_arm64.zip" "${PLUGIN_ID}.dylib")
      - uses: actions/upload-artifact@v4
        with:
          name: codex-auto-ping_darwin_arm64
          path: dist/*.zip

  release:
    if: github.event_name != 'pull_request'
    needs:
      - linux-amd64
      - darwin-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("registry.json"))["plugins"][0]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "${tag#v}" != "${version#v}" ]]; then
              echo "Tag $tag does not match registry version $version" >&2
              exit 1
            fi
          else
            tag="v${version#v}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum codex-auto-ping_*.zip > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
