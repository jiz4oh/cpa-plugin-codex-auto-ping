name: build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' main.go | head -n1)
          test -n "$version"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
      - name: Build and package Linux amd64
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          mkdir -p package dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildmode=c-shared -trimpath -ldflags="-s -w" \
            -o package/auto-ping.so .
          rm -f package/auto-ping.h
          (cd package && zip -q "../dist/auto-ping_${version}_linux_amd64.zip" auto-ping.so)
      - uses: actions/upload-artifact@v4
        with:
          name: auto-ping_linux_amd64
          path: dist/*.zip

  darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' main.go | head -n1)
          test -n "$version"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
      - name: Build and package macOS arm64
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          mkdir -p package dist
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -buildmode=c-shared -trimpath -ldflags="-s -w" \
            -o package/auto-ping.dylib .
          rm -f package/auto-ping.h
          (cd package && zip -q "../dist/auto-ping_${version}_darwin_arm64.zip" auto-ping.dylib)
      - uses: actions/upload-artifact@v4
        with:
          name: auto-ping_darwin_arm64
          path: dist/*.zip

  release:
    if: github.event_name != 'pull_request'
    needs:
      - linux-amd64
      - darwin-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' main.go | head -n1)
            test -n "$version"
            tag="v${version#v}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum auto-ping_*.zip > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Remove legacy raw binaries from older workflow versions if present.
            gh release delete-asset "$TAG" auto-ping_linux_amd64.so --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
            gh release delete-asset "$TAG" auto-ping_darwin_arm64.dylib --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
            gh release upload "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
